<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --ink: #17211c;
      --muted: #5d6b62;
      --line: #dfe5e0;
      --bg: #ffffff;
      --panel: #f5f8f6;
      --accent: #1f6f4a;
      --accent-soft: #e6f1eb;
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    header { margin-bottom: 18px; }
    h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
    .sub { color: var(--muted); font-size: 13px; margin: 0; }

    /* ---- controls ---- */
    .controls {
      display: grid;
      grid-template-columns: minmax(220px, 2fr) repeat(3, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    @media (max-width: 720px) {
      .controls { grid-template-columns: 1fr 1fr; }
      .controls input[type="search"] { grid-column: 1 / -1; }
    }

    input[type="search"], select {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font: inherit;
      color: var(--ink);
      background: var(--bg);
    }
    input[type="search"]:focus, select:focus {
      outline: 2px solid var(--accent-soft);
      border-color: var(--accent);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .linkish {
      background: none; border: 0; padding: 0;
      color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline;
    }

    /* ---- results ---- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      background: var(--bg);
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
      width: 100%;
      /* buttons centre their content by default, which knocks card titles out
         of line with each other across a row */
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
    }
    .card:hover, .card:focus { border-color: var(--accent); background: var(--panel); }
    .card h3 { margin: 0 0 6px; font-size: 15px; }
    .card p { margin: 0; color: var(--muted); font-size: 13px; }

    .tags { margin-top: auto; padding-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      white-space: nowrap;
    }
    .tag.plain { background: var(--panel); color: var(--muted); }

    .empty {
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 28px;
      text-align: center;
      color: var(--muted);
    }

    /* ---- detail ---- */
    dialog {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0;
      max-width: 520px;
      width: calc(100% - 32px);
      color: var(--ink);
    }
    dialog::backdrop { background: rgba(23, 33, 28, 0.35); }
    .detail-body { padding: 20px; }
    .detail-body h2 { margin: 0 0 4px; font-size: 18px; }
    .detail-body dl { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; margin: 16px 0 0; font-size: 14px; }
    .detail-body dt { color: var(--muted); }
    .detail-body dd { margin: 0; }
    .detail-actions { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; }
    .primary, .ghost {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 8px;
      font: inherit;
      line-height: 1.2;
      cursor: pointer;
      text-decoration: none;
    }
    .primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
    .primary:hover { background: #185a3c; }
    .primary:disabled { opacity: 0.6; cursor: default; }
    .ghost { background: none; border: 1px solid var(--line); color: var(--ink); }
    .ghost:hover { background: var(--panel); }

    /* ---- ask panel ---- */
    .ask {
      margin-top: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      background: var(--panel);
    }
    .ask h2 { margin: 0 0 4px; font-size: 14px; }
    .ask .sub { margin-bottom: 10px; }
    .ask-row { display: flex; gap: 8px; }
    .ask-row input { flex: 1; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius); font: inherit; }
    .answer {
      margin-top: 12px; padding: 12px; background: var(--bg);
      border: 1px solid var(--line); border-radius: var(--radius); font-size: 14px;
    }
    .answer .flag { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  </style>
</head>
<body>

<header>
  <h1>Green Buildings Project Repository</h1>
  <p class="sub">Prototype. Data is read live from the linked Google Sheet.</p>
</header>

<div class="controls">
  <input type="search" id="q" placeholder="Search name, summary, city or country" aria-label="Search projects">
  <select id="category" aria-label="Filter by category"><option value="">All categories</option></select>
  <select id="country" aria-label="Filter by country"><option value="">All countries</option></select>
  <select id="status" aria-label="Filter by status"><option value="">All statuses</option></select>
</div>

<div class="meta">
  <span id="count">Loading…</span>
  <button class="linkish" id="reset" hidden>Clear filters</button>
</div>

<div class="grid" id="results"></div>

<section class="ask" id="askPanel" hidden>
  <h2>Ask the repository</h2>
  <p class="sub">Answered from the rows above only. Check any answer before it goes to a partner.</p>
  <div class="ask-row">
    <input id="question" placeholder="Which completed projects cut water use?" aria-label="Question">
    <button class="primary" id="askBtn">Ask</button>
  </div>
  <div class="answer" id="answer" hidden></div>
</section>

<dialog id="detail">
  <div class="detail-body">
    <h2 id="d-name"></h2>
    <p class="sub" id="d-place"></p>
    <p id="d-summary" style="margin-top:12px"></p>
    <dl id="d-fields"></dl>
  </div>
  <div class="detail-actions">
    <button class="ghost" id="d-close">Close</button>
    <a id="d-link" class="primary" style="display:none" target="_blank" rel="noopener">Open project page</a>
  </div>
</dialog>

<script>
  var STATE = { projects: [], filtered: [] };

  var els = {
    q: document.getElementById('q'),
    category: document.getElementById('category'),
    country: document.getElementById('country'),
    status: document.getElementById('status'),
    results: document.getElementById('results'),
    count: document.getElementById('count'),
    reset: document.getElementById('reset'),
    askPanel: document.getElementById('askPanel'),
    question: document.getElementById('question'),
    askBtn: document.getElementById('askBtn'),
    answer: document.getElementById('answer'),
    detail: document.getElementById('detail')
  };

  // ---- load -------------------------------------------------------------

  google.script.run
    .withSuccessHandler(onLoad)
    .withFailureHandler(function (err) {
      els.count.textContent = 'Could not load projects: ' + err.message;
    })
    .getRepositoryPayload();

  function onLoad(payload) {
    STATE.projects = payload.projects || [];
    fillSelect(els.category, payload.facets.category);
    fillSelect(els.country, payload.facets.country);
    fillSelect(els.status, payload.facets.status);
    if (payload.aiEnabled) els.askPanel.hidden = false;
    apply();
  }

  function fillSelect(select, values) {
    (values || []).forEach(function (v) {
      var opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      select.appendChild(opt);
    });
  }

  // ---- filter -----------------------------------------------------------

  ['input', 'change'].forEach(function (evt) {
    els.q.addEventListener(evt, apply);
    els.category.addEventListener(evt, apply);
    els.country.addEventListener(evt, apply);
    els.status.addEventListener(evt, apply);
  });

  els.reset.addEventListener('click', function () {
    els.q.value = '';
    els.category.value = '';
    els.country.value = '';
    els.status.value = '';
    apply();
  });

  function apply() {
    var q = els.q.value.trim().toLowerCase();
    var cat = els.category.value;
    var country = els.country.value;
    var status = els.status.value;

    STATE.filtered = STATE.projects.filter(function (p) {
      if (cat && p.category !== cat) return false;
      if (country && p.country !== country) return false;
      if (status && p.status !== status) return false;
      if (!q) return true;

      var haystack = [p.name, p.summary, p.city, p.country, p.certification, p.id]
        .filter(Boolean).join(' ').toLowerCase();
      return haystack.indexOf(q) !== -1;
    });

    render();
  }

  function render() {
    els.results.innerHTML = '';

    var filtersOn = els.q.value || els.category.value || els.country.value || els.status.value;
    els.reset.hidden = !filtersOn;
    els.count.textContent = STATE.filtered.length + ' of ' + STATE.projects.length + ' projects';

    if (!STATE.filtered.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No projects match those filters.';
      els.results.appendChild(empty);
      return;
    }

    STATE.filtered.forEach(function (p) {
      var card = document.createElement('button');
      card.className = 'card';
      card.type = 'button';

      var h3 = document.createElement('h3');
      h3.textContent = p.name || p.id || 'Untitled project';
      card.appendChild(h3);

      var summary = document.createElement('p');
      summary.textContent = truncate(p.summary, 130);
      card.appendChild(summary);

      var tags = document.createElement('div');
      tags.className = 'tags';
      [p.category, p.certification].filter(Boolean).forEach(function (t) {
        tags.appendChild(tag(t, false));
      });
      [[p.country, p.city].filter(Boolean).join(', '), p.status].filter(Boolean).forEach(function (t) {
        tags.appendChild(tag(t, true));
      });
      card.appendChild(tags);

      card.addEventListener('click', function () { openDetail(p); });
      els.results.appendChild(card);
    });
  }

  function tag(text, plain) {
    var el = document.createElement('span');
    el.className = plain ? 'tag plain' : 'tag';
    el.textContent = text;
    return el;
  }

  function truncate(text, n) {
    text = text || '';
    return text.length > n ? text.slice(0, n - 1).trimEnd() + '…' : text;
  }

  // ---- detail -----------------------------------------------------------

  function openDetail(p) {
    document.getElementById('d-name').textContent = p.name || p.id;
    document.getElementById('d-place').textContent = [p.city, p.country].filter(Boolean).join(', ');
    document.getElementById('d-summary').textContent = p.summary || '';

    var dl = document.getElementById('d-fields');
    dl.innerHTML = '';
    [
      ['Reference', p.id],
      ['Category', p.category],
      ['Certification', p.certification],
      ['Status', p.status],
      ['Year', p.year],
      ['Floor area', p.floor_area_m2 ? Number(p.floor_area_m2).toLocaleString() + ' m²' : '']
    ].forEach(function (pair) {
      if (!pair[1]) return;
      var dt = document.createElement('dt');
      dt.textContent = pair[0];
      var dd = document.createElement('dd');
      dd.textContent = pair[1];
      dl.appendChild(dt);
      dl.appendChild(dd);
    });

    var link = document.getElementById('d-link');
    if (p.link) {
      link.href = p.link;
      link.style.display = 'inline-block';
    } else {
      link.style.display = 'none';
    }

    els.detail.showModal();
  }

  document.getElementById('d-close').addEventListener('click', function () {
    els.detail.close();
  });

  // ---- ask --------------------------------------------------------------

  els.askBtn.addEventListener('click', ask);
  els.question.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') ask();
  });

  function ask() {
    var q = els.question.value.trim();
    if (!q) return;

    els.askBtn.disabled = true;
    els.answer.hidden = false;
    els.answer.textContent = 'Thinking…';

    google.script.run
      .withSuccessHandler(function (res) {
        els.askBtn.disabled = false;
        els.answer.innerHTML = '';
        if (!res.ok) {
          els.answer.textContent = res.error || 'No answer.';
          return;
        }
        var flag = document.createElement('span');
        flag.className = 'flag';
        flag.textContent = 'AI generated from the rows above. Check before sharing.';
        var body = document.createElement('div');
        body.textContent = res.answer;
        els.answer.appendChild(flag);
        els.answer.appendChild(body);
      })
      .withFailureHandler(function (err) {
        els.askBtn.disabled = false;
        els.answer.textContent = 'Request failed: ' + err.message;
      })
      .askRepository(q);
  }
</script>

</body>
</html>
